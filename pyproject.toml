[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fit-to-md"
version = "0.1.0"
description = "CLI tool to convert FIT activity files into token-efficient Markdown reports."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fitdecode>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
fit-to-md = "fit_to_md.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
