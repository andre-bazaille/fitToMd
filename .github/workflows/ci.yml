name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install --upgrade --editable ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Check formatting
        run: ruff format --check src tests

      - name: Check types
        run: mypy

      - name: Run tests with coverage
        run: pytest

  windows-activity-time-output:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install --upgrade --editable ".[dev]"

      - name: Test activity-time output on Windows
        run: >-
          pytest --override-ini=addopts=
          tests/unit/cli/test_cli.py::test_run_can_name_output_from_activity_start_time
          tests/unit/cli/test_cli.py::test_run_uses_activity_time_names_and_skips_existing_reports
